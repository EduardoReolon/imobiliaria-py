{% extends 'base.html' %}

{% block title %}Login | Imobiliária Manduri{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 mb-20 bg-white p-8 rounded-lg shadow-md border-t-4 border-orange-500">
    <h1 class="text-2xl font-bold text-amber-900 mb-6 text-center">Acesso Restrito</h1>

    {% if form.errors %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm font-bold text-center">
            Usuário ou senha incorretos. Tente novamente.
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="id_username" class="block text-sm font-bold text-gray-700 mb-1">Usuário</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full border border-gray-300 rounded p-3 focus:ring-orange-500 focus:border-orange-500">
        </div>

        <div class="mb-6">
            <label for="id_password" class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full border border-gray-300 rounded p-3 focus:ring-orange-500 focus:border-orange-500">
        </div>

        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded transition duration-200">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
